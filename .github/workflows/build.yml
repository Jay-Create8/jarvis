name: JARVIS bauen
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen
        run: |
          ZIP="$(git -c core.quotePath=false log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -n1)"
          echo "Baue aus: $ZIP"
          unzip -q -o "$ZIP" -d src
          cd src/jarvis
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/JARVIS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: JARVIS ${{ github.run_number }}
          files: JARVIS.apk
