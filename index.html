<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<meta name="mobile-web-app-capable" content="yes">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#02060c;color:#cfefff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.b{width:min(340px,calc(100vw - 32px))}
.o{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle,#fff 0,#2de2ff 25%,transparent 70%);box-shadow:0 0 50px #2de2ff;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(.88);opacity:.75}}
h1{font-size:20px;letter-spacing:.32em;color:#2de2ff;margin:0 0 16px;font-weight:700}
.bar{height:6px;border-radius:3px;background:#0b2233;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2de2ff;box-shadow:0 0 10px #2de2ff;transition:width .4s}
#s{margin-top:12px;color:#8fb7cc;font-size:14px;min-height:3em}
#h{margin-top:10px;color:#5f8396;font-size:13px}
button{margin-top:12px;padding:9px 16px;border-radius:9px;border:1px solid #2de2ff;background:none;color:#7ff3ff;font:inherit}
</style>
</head>
<body>
<div class="b">
  <div class="o"></div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="bar"><i id="bar"></i></div>
  <div id="s">Startet …</div>
  <div id="h"></div>
</div>
<script nomodule>location.replace('app.html' + location.search + location.hash);</script>
<script type="module">
// 5.8 start page (~4 KB): loads JARVIS part by part. Drops in the connection only cost the current 16 KB part –
// everything already loaded stays on the phone, also across reloads. Second start: straight from the phone, no network.
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const go = () => location.replace('app.html' + location.search + location.hash);
const say = (t, h) => { $('s').innerHTML = t; if (h !== undefined) $('h').innerHTML = h; };
const kb = n => n < 10240 ? (n / 1024).toFixed(1) : Math.round(n / 1024);
const dur = s => s < 90 ? Math.max(1, Math.round(s)) + ' s' : Math.round(s / 60) + ' Min.';
let sw = null; try{ sw = navigator.serviceWorker || null; }catch{}   // some privacy modes throw here
sw?.register('sw.js').catch(() => {});
const controlled = ms => !sw ? Promise.resolve(false) : sw.controller ? Promise.resolve(true)
  : new Promise(r => { const t = setTimeout(() => r(!!sw.controller), ms); sw.addEventListener('controllerchange', () => { clearTimeout(t); r(true); }, {once:true}); });
const onWait = w => say(`📶 Verbindung weg – neuer Versuch in ${w.sekunden} s`, 'Keine Sorge: Alles bereits Geladene bleibt gespeichert, es geht genau dort weiter.');
let L = null;
for (let i = 0; !L; i++){   // the loader itself (~2 KB); a new URL per try, because browsers remember failed module loads
  try{ L = await import('./loader.js' + (i ? '?r=' + i : '')); }
  catch{ onWait({sekunden: Math.min(20, 3 + i * 3)}); await sleep(Math.min(20, 3 + i * 3) * 1000); }
}
if (!L.supported()) go();   // very old browser: normal loading
else {
  const cur = await L.findCore();
  if (cur && await controlled(5000)){ await L.cleanup(cur.name).catch(() => {}); go(); }
  else {
    const t0 = Date.now();
    for (let n = 0; ; n++){
      try{
        say('Hole die Dateiliste …', cur ? '' : 'Erster Start: JARVIS wird auf dem Handy gespeichert. Danach startet er sofort – auch ohne Netz.');
        const man = await L.getManifest({onWait});
        await L.ensure(['req'], {man, onWait, onProgress:p => {
          const pct = p.total ? Math.min(100, p.done / p.total * 100) : 100; $('bar').style.width = pct + '%';
          const rest = p.kbs > 0 ? (p.total - p.done) / 1024 / p.kbs : 0;
          say(`Lädt JARVIS: <b>${kb(p.done)} / ${kb(p.total)} KB</b>${p.kbs ? ` · ${p.kbs < 10 ? p.kbs.toFixed(1) : Math.round(p.kbs)} KB/s` : ''}${rest > 3 ? ` · noch ca. ${dur(rest)}` : ''}`,
            (p.wiederverwendet ? `♻️ ${kb(p.wiederverwendet)} KB von der alten Version übernommen. ` : '') + 'Bricht das Netz ab, macht JARVIS automatisch weiter – Geladenes bleibt gespeichert.' + (Date.now() - t0 > 20000 ? ' Du kannst die Seite auch schliessen und später wieder öffnen.' : ''));
        }});
        await L.markComplete(man);
        break;
      }catch(e){ say('⚠️ ' + (e.message || e) + ' – neuer Versuch …', ''); await sleep(Math.min(30, 4 + n * 4) * 1000); }
    }
    $('bar').style.width = '100%'; say('Fertig – JARVIS startet …', '');
    if (!(await controlled(30000))) say('Fertig – JARVIS startet …', 'Der Offline-Speicher braucht noch einen Moment.');
    go();
  }
}
</script>
</body>
</html>
